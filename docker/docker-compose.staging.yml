name: cloudpilot-staging

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudpilot-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudpilot_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-cloudpilot_staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cloudpilot_staging} -d ${POSTGRES_DB:-cloudpilot_staging}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudpilot-staging-net

  redis:
    image: redis:7-alpine
    container_name: cloudpilot-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudpilot-staging-net

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: cloudpilot-staging-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-cloudpilot_staging}:${POSTGRES_PASSWORD:-staging_secure_password_123}@postgres:5432/${POSTGRES_DB:-cloudpilot_staging}?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:-staging_cookie_signing_secret_987654321}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,https://localhost,http://cloudpilot.local,https://cloudpilot.local}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-https://cloudpilot.local/api/v1/github/callback}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-staging_webhook_secret_123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudpilot-staging-net

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: cloudpilot-staging-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cloudpilot_staging}:${POSTGRES_PASSWORD:-staging_secure_password_123}@postgres:5432/${POSTGRES_DB:-cloudpilot_staging}?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudpilot-staging-net

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: cloudpilot-staging-web
    restart: unless-stopped
    networks:
      - cloudpilot-staging-net

  nginx:
    image: nginx:alpine
    container_name: cloudpilot-staging-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cloudpilot-staging-net

volumes:
  postgres_staging_data:
    name: cloudpilot_staging_postgres_data
  redis_staging_data:
    name: cloudpilot_staging_redis_data

networks:
  cloudpilot-staging-net:
    name: cloudpilot-staging-net
    driver: bridge
